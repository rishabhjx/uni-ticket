name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - claude/ticketing-app-ui-prototype-2w0xai
  workflow_dispatch:

# The build output is force-pushed to the gh-pages branch, which is what this
# repository's Pages site serves. Creating that branch is also what enabled
# Pages in the first place: GITHUB_TOKEN cannot create a Pages site through
# the API, since that needs admin rights it is never granted.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages runs Jekyll by default, which skips directories starting with
          # an underscore — that would drop all of _next.
          touch out/.nojekyll
          cd out
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
